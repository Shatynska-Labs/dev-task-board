name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - id: decision
        run: node tools/release-decision.mjs >> "$GITHUB_OUTPUT"
      - if: steps.decision.outputs.publish == 'true'
        run: npm ci
      - if: steps.decision.outputs.publish == 'true'
        run: npm publish --provenance
